name: diet-tracker

services:
  db:
    image: postgres:17-alpine
    container_name: diet-tracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diet_tracker
    # Host port 5433 so this never collides with another project's Postgres on 5432.
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d diet_tracker']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
